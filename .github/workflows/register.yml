name: Register games
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: register-${{ github.event.issue.number || github.event.pull_request.number }}
jobs:
  issue:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'add-game')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const {fromIssue} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/bot.mjs`);
            await fromIssue({github, context});
  pull-request:
    # pull_request_target runs this repository's code from main. The PR's files are read as data, never checked out.
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/github-script@v7
        with:
          script: |
            const {fromPullRequest} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/bot.mjs`);
            await fromPullRequest({github, context});
  verify:
    if: >-
      github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/verify') &&
      (github.event.comment.user.login == github.event.issue.user.login || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const {verify} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/bot.mjs`);
            await verify({github, context});
