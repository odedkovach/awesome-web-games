name: Update lists
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [curated.json, scripts/**]
permissions:
  contents: write
concurrency:
  group: sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/*.test.mjs
      - run: node scripts/build-readme.mjs
      - name: Commit if changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'Update lists from the Appside catalog and Index'
          git push
